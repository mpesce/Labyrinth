; LAB.INI -- Labyrinth settings (read from beside Labyrinth.exe)
[Main]
; Load the Home world at start-up (yes/no) and where it is (file or URL)
Autoload Home=no
Home=samples\vrml1.wrl
; Program to open non-world links with; leave unset for the default browser
;BROWSER=
; Draw back faces in Labyrinth-language worlds (yes/no)
TwoSided=no
; Antialiasing: samples per pixel (0 turns it off)
Antialias=4
; "original" restores 2.0a2's message box for every VRML node
VRMLTraversal=render
; 1 makes unknown VRML nodes and fields an error, as QvLib did
VRMLStrict=0
